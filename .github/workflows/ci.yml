name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # Oldest supported Go. Linux only: Go 1.22 binaries don't load on
          # current macOS runners (dyld: missing LC_UUID).
          - os: ubuntu-latest
            go: "1.22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build the starter example
        run: go run ./cmd/garden build -c examples/starter/garden.yaml
