<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<link rel="stylesheet" href="garden.css">
{{range .Stylesheets}}<link rel="stylesheet" href="{{.}}">
{{end}}
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <a class="bar-title" id="site-title" href="index.html">{{.Title}}</a>
    <div class="search" id="search">
      <svg class="search-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <label class="sr-only" for="search-input">Search notes</label>
      <input id="search-input" type="search" placeholder="Search notes" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-panel">
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <div class="search-panel" id="search-panel" hidden></div>
    </div>
    <span class="bar-stats" id="stats"></span>
  </header>

  <main class="panes" id="panes" aria-live="polite">
    <div class="loading" id="loading">Loading notes…</div>
  </main>
  <div class="preview" id="preview" role="tooltip" hidden></div>
</div>
<noscript><p class="noscript">This garden needs JavaScript for the stacked view. Every note is also a plain page under <a href="notes/">notes/</a>.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="garden.js"></script>
</body>
</html>
